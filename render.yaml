services:
  # Backend: Web Service (Java)
  - type: web
    name: issueflow-api
    runtime: java
    plan: free
    buildCommand: ./mvnw clean package -DskipTests
    startCommand: java -jar target/issueflow-0.0.1-SNAPSHOT.jar
    envVars:
      - key: DB_HOST
        fromDatabase:
          name: issueflow-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: issueflow-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: issueflow-db
          property: database
      - key: SPRING_DATASOURCE_USERNAME
        fromDatabase:
          name: issueflow-db
          property: user
      - key: SPRING_DATASOURCE_PASSWORD
        fromDatabase:
          name: issueflow-db
          property: password
      - key: APP_JWTSECRET
        generateValue: true
      - key: ALLOWED_ORIGIN
        fromService:
          type: web
          name: issueflow-frontend
          property: url

  # Frontend: Static Site
  - type: web
    name: issueflow-frontend
    runtime: static
    plan: free
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    rootDirectory: frontend
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: issueflow-api
          property: url

databases:
  - name: issueflow-db
    plan: free
