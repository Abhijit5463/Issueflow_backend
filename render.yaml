services:
  # Backend: Web Service (Java)
  - type: web
    name: issueflow-api
    runtime: docker
    plan: free
    envVars:
      - key: DB_HOST
        fromDatabase:
          name: issueflow-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: issueflow-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: issueflow-db
          property: database
      - key: SPRING_DATASOURCE_USERNAME
        fromDatabase:
          name: issueflow-db
          property: user
      - key: SPRING_DATASOURCE_PASSWORD
        fromDatabase:
          name: issueflow-db
          property: password
      - key: APP_JWTSECRET
        generateValue: true
      - key: ALLOWED_ORIGIN
        value: https://issueflow-frontend.onrender.com

  # Frontend: Static Site
  - type: web
    name: issueflow-frontend
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    rootDir: frontend
    envVars:
      - key: VITE_API_BASE_URL
        value: https://issueflow-api.onrender.com

databases:
  - name: issueflow-db
    plan: free
